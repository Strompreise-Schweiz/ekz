name: Update prices

# Day prices of the dynamic tariffs: download, then build every published file.
on:
  schedule:
    # GitHub does not guarantee these times, so one run is not enough. Later runs
    # are fallbacks: they change nothing if the data is already there. Most utilities
    # publish by 18:00 on the day before. Off the full hour, when GitHub is busiest.
    - cron: "35 18 * * *"
      timezone: "Europe/Zurich"
    - cron: "5 20 * * *"
      timezone: "Europe/Zurich"
    - cron: "5 22 * * *"
      timezone: "Europe/Zurich"
  # Also the entry point for an external scheduler, see tariff-core/docs/scheduling.md.
  workflow_dispatch: {}

permissions:
  contents: write

# Shared with "Update tariffs": both commit data/.
concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    uses: Strompreise-Schweiz/tariff-core/.github/workflows/reusable-update.yml@main
    with:
      fetch: prices
