name: Fetch tariffs

on:
  schedule:
    # 17:30 UTC = 18:30 CET / 19:30 CEST, i.e. always after 18:00 Europe/Zurich time.
    # Off the top of the hour on purpose, since that's when GitHub's scheduler is busiest.
    - cron: "30 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-tariffs
  cancel-in-progress: false

jobs:
  fetch:
    uses: Strompreise-Schweiz/tariff-etl/.github/workflows/reusable-fetch.yml@main
